# Baut die Website wie beim Deploy: Schriften, Fotos, Technik-PDFs, Version, Angular-Build, strukturierte Daten, Fehlerseite.
# Genutzt von deploy-pages.yml und screenshots.yml – so entstehen Referenzbilder und Prüfung aus demselben Build.
# Voraussetzung: Checkout (mit Tags), Node und `npm ci` sind bereits gelaufen.
name: Website bauen
description: Baut dist/blickfeld-nord/browser wie beim Deploy
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Schriften verkleinern (Icons und Textschriften)
      shell: bash
      run: |
        pip install --quiet fonttools brotli
        python scripts/subset-icons.py
        python scripts/subset-fonts.py

    - name: Fotos vorbereiten (Vorschaubilder, Größe, GPS-Prüfung)
      shell: bash
      run: |
        pip install --quiet pillow
        python scripts/bilder.py

    # Alle Downloads in public/presse/ neu erzeugen: Pressekit (PDF/ZIP), Technik-Rider, Bühnenplan, QR-Karte und
    # Wunschbox-Schild – so sind sie nach jeder Änderung an Texten, technik.json oder Fotos aktuell, ohne Handarbeit
    - name: PDFs neu erzeugen (Pressekit, Technik-Rider, Bühnenplan, QR-Karte, Wunschbox)
      shell: bash
      run: |
        pip install --quiet reportlab pillow fonttools segno
        python scripts/build-pressekit.py
        python scripts/build-rider.py
        python scripts/build-qr-karte.py

    - name: Version (letzter Release-Tag) für den Footer
      shell: bash
      run: node scripts/write-version.mjs

    - name: Oberflächentexte für Backstage → Übersetzungen sammeln
      shell: bash
      run: node scripts/ui-texte.mjs

    - name: Build
      shell: bash
      run: npx ng build --base-href /

    - name: Structured data, sitemap and robots.txt
      shell: bash
      run: node scripts/seo.mjs

    - name: SPA fallback for client-only routes
      shell: bash
      run: |
        cd dist/blickfeld-nord/browser
        # Öffentliche Seiten sind vorgerendert (eigene index.html je Route).
        # Unbekannte Pfade bekommen die vorgerenderte Fehlerseite, Backstage die clientseitige Shell.
        cp 404/index.html 404.html
        mkdir -p backstage && cp index.csr.html backstage/index.html
        # Backstage-Unterseiten (/backstage/<id>[/<teil>]) haben keine eigene Datei: Die Fehlerseite leitet sie
        # zur Backstage-Shell weiter (/backstage/?auftritt=<id>[&teil=<teil>], „#…“ bleibt erhalten), die dann zur Unterseite navigiert.
        sed -i 's#<head>#<head><script>var p=location.pathname.split("/");if(p[1]=="backstage")if(p[2])location.replace("/backstage/?auftritt="+p[2]+(p[3]?"\\x26teil="+p[3]:"")+location.hash)</script>#' 404.html

    - name: Content-Security-Policy (Hashes der Inline-Skripte je Seite)
      shell: bash
      run: node scripts/csp.mjs
