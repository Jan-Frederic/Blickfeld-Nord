# Prüft Pull Requests (z. B. von Dependabot), bevor sie auf main landen: Tests, Build und Linkcheck.
name: Prüfung

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR-Titel muss Conventional Commits folgen – er wird beim Squash-Merge zur Commit-Nachricht
  # und bestimmt damit die nächste Version (semantic-release)
  pr-titel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: PR-Titel prüfen
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (Inhalte in band.service.ts)
        run: npx ng test --watch=false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Icon font subset
        run: |
          pip install --quiet fonttools brotli
          python scripts/subset-icons.py

      - name: Fotos vorbereiten (Vorschaubilder, Größe, GPS-Prüfung)
        run: |
          pip install --quiet pillow
          python scripts/bilder.py

      - name: PDFs neu erzeugen (Pressekit, Technik-Rider, Bühnenplan, QR-Karte, Wunschbox)
        run: |
          pip install --quiet reportlab pillow fonttools segno
          python scripts/build-pressekit.py
          python scripts/build-rider.py
          python scripts/build-qr-karte.py

      - name: Build
        run: npx ng build --base-href /

      - name: Structured data, sitemap and robots.txt
        run: node scripts/seo.mjs

      - name: Linkcheck
        run: |
          node scripts/spa-fallback.mjs
          node scripts/check-links.mjs
