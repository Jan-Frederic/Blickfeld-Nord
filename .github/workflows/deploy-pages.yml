# Deploys the Angular app to GitHub Pages using the modern Actions flow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (Inhalte in band.service.ts)
        run: npx ng test --watch=false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Icon font subset
        run: |
          pip install --quiet fonttools brotli
          python scripts/subset-icons.py

      - name: Build
        run: npx ng build --base-href /

      - name: Structured data, sitemap and robots.txt
        run: node scripts/seo.mjs

      - name: SPA fallback for client-only routes
        run: |
          cd dist/blickfeld-nord/browser
          # Öffentliche Seiten sind vorgerendert (eigene index.html je Route).
          # Unbekannte Pfade bekommen die vorgerenderte Fehlerseite, Backstage die clientseitige Shell.
          cp 404/index.html 404.html
          mkdir -p backstage && cp index.csr.html backstage/index.html

      - name: Linkcheck (interne Links und Bilder; externe Links nur als Warnung)
        run: node scripts/check-links.mjs --extern

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/blickfeld-nord/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Ladezeit-Wächter: prüft die Live-Seite nach jedem Deploy mit Lighthouse (Handy-Profil, je 3 Durchläufe).
  # Schlägt fehl (rotes X + E-Mail), wenn Leistung < 75, Barrierefreiheit oder SEO < 95 – die Seite bleibt trotzdem online.
  # Berichte zum Nachlesen: Actions → Lauf → Artifacts → lighthouse-berichte
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kurz warten, bis die neue Version ausgeliefert wird
        run: sleep 60

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json

      - name: Berichte speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-berichte
          path: lighthouse-berichte
          retention-days: 30
