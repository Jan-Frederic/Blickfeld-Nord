# Deploys the Angular app to GitHub Pages using the modern Actions flow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Täglich neu bauen, auch ohne Änderung: vorgerenderte Seiten (vergangene Konzerte → Rückblick, Sitemap,
  # Jahresrückblick ab dem 15.12.) bleiben aktuell. Hinweis: GitHub pausiert Zeitpläne nach 60 Tagen ohne Commits.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Ein neuer Push bricht einen laufenden Deploy ab (die neue Version zählt). Der tägliche oder manuelle Lauf wartet
# dagegen, bis der laufende fertig ist – sonst bräche er dessen Lighthouse-Messung ab und es fehlten Werte.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Neue Version per semantic-release: wertet die Conventional Commits seit dem letzten Tag aus
  # (feat → 1.x.0, fix/perf/content → 1.0.x, „!“/BREAKING CHANGE → x.0.0), legt Tag und
  # GitHub-Release mit Release Notes an. Ohne relevante Commits passiert nichts. Konfiguration: .releaserc.json
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # komplette Historie inkl. Tags – für die Versionsnummer im Footer
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (Inhalte in band.service.ts)
        run: npx ng test --watch=false

      - name: Website bauen (Schriften, Fotos, Build, strukturierte Daten, Fehlerseite)
        uses: ./.github/actions/build-site

      - name: Chromium für die Prüfungen
        uses: ./.github/actions/playwright

      - name: Barrierefreiheit (WCAG 2.1 AA, axe-core) – schwere Verstöße stoppen den Deploy
        run: node scripts/a11y.mjs

      - name: Service Worker für den Offline-Backstage
        run: node scripts/build-sw.mjs

      - name: Klicktests (wichtige Abläufe wie ein Besucher durchklicken) – ein Fehler stoppt den Deploy
        run: node scripts/e2e.mjs

      - name: Screenshot-Vergleich (Layout in DE/EN/NL, Desktop und Handy) – verrutschte Seiten stoppen den Deploy
        run: |
          if [ -z "$(ls tests/visual/referenz 2>/dev/null)" ]; then
            echo "::notice::Noch keine Referenzbilder – einmal Actions → „Screenshots aktualisieren“ starten."
            exit 0
          fi
          npx playwright test || {
            echo "::error::Seiten sehen anders aus als die Referenzbilder. Unterschiede: Lauf → Artifacts → screenshot-vergleich (rot markiert). Gewollte Änderung? Actions → „Screenshots aktualisieren“ starten – danach läuft der Deploy automatisch neu."
            exit 1
          }

      - name: Unterschiede des Screenshot-Vergleichs speichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-vergleich
          path: |
            screenshot-bericht
            screenshot-ergebnisse
          retention-days: 14

      - name: Linkcheck (interne Links und Bilder; externe Links nur als Warnung)
        run: node scripts/check-links.mjs --extern

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/blickfeld-nord/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Live-Check nach jedem Deploy (auch nach dem von „Screenshots aktualisieren“ angestoßenen): startet den Workflow
  # live-check.yml – er wartet kurz, prüft alle Seiten, Pressekits und Downloads und meldet Probleme als Issue
  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Live-Check starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-check.yml --ref main -R "${{ github.repository }}"

  # Ladezeit-Wächter: prüft die Live-Seite nach jedem Deploy mit Lighthouse (Handy-Profil, je 5 Durchläufe, Median):
  # Startseite, Booking, Historie, Galerie und eine Konzertseite (lighthouserc.json).
  # Schlägt fehl (rotes X + E-Mail), wenn Leistung < 85 (Start, Booking, Historie), Barrierefreiheit oder SEO < 95 –
  # Galerie und Konzertseite werden bei der Leistung nur gemeldet (Warnung). Die Seite bleibt in jedem Fall online.
  # Berichte zum Nachlesen: Actions → Lauf → Artifacts → lighthouse-berichte
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Kurz warten, bis die neue Version ausgeliefert wird
        run: sleep 60

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json

      - name: Werte zusammenfassen (Median je Seite)
        if: always()
        run: node scripts/lighthouse-summary.mjs

      - name: Berichte speichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-berichte
          path: lighthouse-berichte
          retention-days: 30
