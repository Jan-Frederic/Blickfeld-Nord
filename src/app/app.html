<mat-toolbar class="topbar">
  <button class="logo" (click)="scrollTo('home')" aria-label="Blickfeld Nord – nach oben">
    <span class="logo-main">Blickfeld</span><span class="logo-sub">Nord</span>
  </button>
  <span class="spacer"></span>
  <nav class="desktop-nav">
    @for (n of nav; track n.id) {
      <button mat-button (click)="scrollTo(n.id)">{{ n.label }}</button>
    }
  </nav>
  <button mat-icon-button class="mobile-nav" [matMenuTriggerFor]="menu" aria-label="Menü öffnen">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (n of nav; track n.id) {
      <button mat-menu-item (click)="scrollTo(n.id)">{{ n.label }}</button>
    }
  </mat-menu>
</mat-toolbar>

<main>
  <router-outlet />
</main>

<footer>
  <div class="social">
    <a mat-icon-button href="https://www.instagram.com/blickfeldnord/" target="_blank" rel="noopener" aria-label="Blickfeld Nord auf Instagram">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="17.4" cy="6.6" r="1.3" fill="currentColor" />
      </svg>
    </a>
    <a mat-icon-button href="mailto:Matthiaswigger@me.com" aria-label="E-Mail an Matthias Wigger"><mat-icon>mail</mat-icon></a>
  </div>
  <nav class="legal-links">
    <a routerLink="/impressum">Impressum</a>
    <a routerLink="/datenschutz">Datenschutz</a>
  </nav>
  <p>© {{ year }} Blickfeld Nord · Alle Rechte vorbehalten</p>
</footer>
